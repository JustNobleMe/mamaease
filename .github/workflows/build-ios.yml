name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS .ipa
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Fastlane
        run: cd ios && sudo gem install fastlane && fastlane update

      - name: Setup code signing with Fastlane
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.APPLE_ITC_TEAM_ID }}
        run: |
          cd ios
          fastlane match development --readonly --skip_confirmation || true

      - name: Build IPA
        run: flutter build ipa --export-method app-store

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ios/ipa/*.ipa
